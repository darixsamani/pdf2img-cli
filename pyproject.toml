[project]
name = "pdf2img-cli"
version = "0.1.1"
description = "command-line interface (CLI) to tranform pdf to images"
readme = "README.md"
authors = [
    { name = "Darix Samani Siewe", email = "samanidarix@gmail.com" },
]
requires-python = ">=3.8"
dependencies = [
    "pdf2image>=1.17.0",
    "typer>=0.20.1",
]

[project.scripts]
pdf2images = "pdf2img_cli.__main__:main_cli"

[tool.setuptools.packages.find]
exclude = ["images"]

[tool.uv]
package = true
